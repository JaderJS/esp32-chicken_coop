; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps=
    elims/PsychicMqttClient @ ^0.2.4
    bblanchon/ArduinoJson @ ^7.4.3
    ESP32Async/AsyncTCP @ 3.3.7
    adafruit/DHT sensor library @ ^1.4.7

build_flags=    
    -D WIFI_SSID=\"${sysenv.WIFI_SSID}\"
    -D WIFI_PASS=\"${sysenv.WIFI_PASS}\"
    -D API_KEY_WEATHER=\"${sysenv.API_KEY_WEATHER}\"
    -D MQTT_URL=\"${sysenv.MQTT_URL}\"
    -D MQTT_USER=\"${sysenv.MQTT_USER}\"
    -D MQTT_PASS=\"${sysenv.MQTT_PASS}\"

extra_scripts= env.py

monitor_port=/dev/ttyUSB0 
monitor_speed = 115200
 